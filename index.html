<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Personal Finance"/>
<meta name="theme-color" content="#F7F6F3"/>
<title>Personal Finance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'DM Sans',sans-serif;background:#F7F6F3;-webkit-tap-highlight-color:transparent}input,select,button{font-family:inherit}</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(() => {
  const { useState, useEffect, useCallback } = React;
  const h = React.createElement;

  const toNum = (v) => {
    if (typeof v === "number") return Number.isFinite(v) ? v : 0;
    if (typeof v === "string") { const cleaned = v.replace(/[$,\s]/g, ""); const n2 = Number(cleaned); return Number.isFinite(n2) ? n2 : 0; }
    const n = Number(v); return Number.isFinite(n) ? n : 0;
  };

  // Firebase — primary fast database
  const FB = "https://personal-finance-14429-default-rtdb.asia-southeast1.firebasedatabase.app";
  const FB_API_KEY = "AIzaSyCMglegtfReOW9sirBwP-YQ_v9ONKMjNus";
  // Sheets Apps Script — background backup only
  const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxtRIEhkYHpW9iNkOydrLOq96yfbN-GciPzIq6FUkSfsjZjqjP11gb1QC8Tp02zNgYTyQ/exec";

  // Firebase auth via REST API — no SDK needed.
  let _idToken = null;
  let _refreshToken = (() => { try { return localStorage.getItem("fb_refresh_token_v2"); } catch(e) { return null; } })();
  let _tokenExpiry = 0;

  const _saveRefreshToken = (t) => {
    _refreshToken = t;
    try { localStorage.setItem("fb_refresh_token_v2", t); } catch(e) {}
  };

  const getAuthToken = async () => {
    const now = Date.now();
    if (_idToken && now < _tokenExpiry - 60000) return _idToken;

    if (_refreshToken) {
      try {
        const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(_refreshToken)}`
        });
        const d = await r.json();
        if (d.id_token) {
          _idToken = d.id_token;
          _saveRefreshToken(d.refresh_token);
          _tokenExpiry = now + parseInt(d.expires_in) * 1000;
          return _idToken;
        }
      } catch(e) {}
    }

    const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_API_KEY}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: "ziadehpatrick@gmail.com", password: "plko!!!1", returnSecureToken: true })
    });
    const d = await r.json();
    if (!d.idToken) throw new Error("Firebase auth failed: " + JSON.stringify(d));
    _idToken = d.idToken;
    _saveRefreshToken(d.refreshToken);
    _tokenExpiry = now + parseInt(d.expiresIn) * 1000;
    return _idToken;
  };

  const fb = {
    async get(path) {
      try {
        const token = await getAuthToken();
        const r = await fetch(`${FB}/${path}.json?auth=${token}`);
        return r.ok ? r.json() : null;
      } catch(e) { return null; }
    },
    async post(path, data) {
      try {
        const token = await getAuthToken();
        const r = await fetch(`${FB}/${path}.json?auth=${token}`, { method: "POST", body: JSON.stringify(data) });
        return r.json();
      } catch(e) { return null; }
    },
    async put(path, data) {
      try {
        const token = await getAuthToken();
        const r = await fetch(`${FB}/${path}.json?auth=${token}`, { method: "PUT", body: JSON.stringify(data) });
        return r.json();
      } catch(e) { return null; }
    },
    async remove(path) {
      try {
        const token = await getAuthToken();
        await fetch(`${FB}/${path}.json?auth=${token}`, { method: "DELETE" });
        return true;
      } catch(e) { return false; }
    }
  };

  // Sheets backup sync — uses GET with payload in query string.
  // POST doesn't work because Google's 302 redirect converts POST→GET
  // before the script executes, so doPost never fires.
  const sheetsSync = async (data) => {
    try {
      const payload = encodeURIComponent(JSON.stringify(data));
      await fetch(`${SHEETS_URL}?action=sync&payload=${payload}`, {
        mode: "no-cors",
        redirect: "follow"
      });
    } catch(e) {
      console.warn("Sheets sync failed:", e);
    }
  };

  // Single sort function used EVERYWHERE for consistency.
  const sortTx = (list) => list.slice().sort((a, b) => {
    if (a.date < b.date) return 1;
    if (a.date > b.date) return -1;
    if (a.id > b.id) return -1;
    if (a.id < b.id) return 1;
    return 0;
  });

  const fmt = (n) => {
    const value = toNum(n);
    const a = Math.abs(value);
    const s = a >= 1e3 ? a.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 }) : Math.round(a * 100) / 100 + "";
    return value < 0 ? `-$${s}` : `$${s}`;
  };
  const pct = (n) => `${(n * 100).toFixed(1)}%`;
  const monthLabel = (ym) => {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
  };
  const monthShort = (ym) => {
    const [y, m] = ym.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short" });
  };
  const shiftMonth = (ym, delta) => {
    const [y, m] = ym.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  };
  const thisMonth = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  };

  const FONT = "'DM Sans',sans-serif";
  const MONO = "'JetBrains Mono',monospace";
  const C = {
    bg: "#F7F6F3", card: "#FFFFFF", border: "#E8E6E1",
    text: "#1A1A1A", sub: "#6B6B6B", muted: "#9B9B9B",
    accent: "#2D5A27", accentLight: "#E8F0E7",
    red: "#C53030", redLight: "#FFF0F0",
    blue: "#2B6CB0", blueLight: "#EBF4FF",
    amber: "#B7791F", amberLight: "#FFFAF0",
    gold: "#A67C00", goldLight: "#FFF8E1",
    purple: "#7C3AED", purpleLight: "#F3EEFF",
    teal: "#0D9488", tealLight: "#E6FFF9",
    shadow: "0 1px 3px rgba(0,0,0,0.05)"
  };

  // ————— Account & category system —————
  // Envelope method: every account is an envelope with a monthly budget.
  // Home/Lifestyle/Personal/Wedding are SPENDING envelopes (budget = max spend).
  // Savings/Portfolio are SAVING envelopes (budget = contribution target).
  const ACCT_OPTS = ["Home", "Lifestyle", "Savings", "Portfolio", "Wedding"];
  const SAVING_ACCTS = ["Savings", "Portfolio"];
  const ACCT_META = {
    Home:      { emoji: "🏠", color: C.accent, light: C.accentLight, desc: "Essentials, furniture, repairs, bills" },
    Lifestyle: { emoji: "✨", color: C.amber,  light: C.amberLight, desc: "Fun, personal, travel, dining, groceries, car" },
    Savings:   { emoji: "💵", color: C.gold,   light: C.goldLight,  desc: "Future kids & emergency (USD/gold)" },
    Portfolio: { emoji: "📈", color: C.blue,   light: C.blueLight,  desc: "IBKR investing" },
    Wedding:   { emoji: "💍", color: C.purple, light: C.purpleLight, desc: "Wedding budget (deducts from Home)" }
  };
  const CATEGORIES = ["Salary", "Groceries", "Dining", "Travel", "Car", "Shopping", "Furniture", "Repairs", "Bills", "Health", "Gifts", "Invest", "Transfer", "Other"];
  const DEFAULT_BUDGETS = { Home: 2500, Lifestyle: 2000, Savings: 500, Portfolio: 1000, Wedding: 0 };

  function Icon({ name, size = 18, color = C.sub }) {
    const d = {
      home: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
      chart: "M16 8v8m-8-4v4m4-12v12",
      wallet: "M21 12V7H5a2 2 0 01-2-2m0 0a2 2 0 012-2h14v4M3 5v14a2 2 0 002 2h16v-5",
      plus: "M12 5v14M5 12h14",
      refresh: "M20.49 15a9 9 0 11-2.12-9.36L23 10",
      car: "M5 17h2m10 0h2M3 11l1.5-5h15l1.5 5"
    };
    if (name === "ring") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("circle", { cx: "12", cy: "14", r: "7" }), h("path", { d: "M8 6L12 2l4 4" }));
    if (name === "trending") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("polyline", { points: "23 6 13.5 15.5 8.5 10.5 1 18" }), h("polyline", { points: "17 6 23 6 23 12" }));
    if (name === "building") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("rect", { x: "4", y: "2", width: "16", height: "20", rx: "1" }), h("line", { x1: "9", y1: "6", x2: "9", y2: "6.01" }), h("line", { x1: "15", y1: "6", x2: "15", y2: "6.01" }), h("line", { x1: "9", y1: "10", x2: "9", y2: "10.01" }), h("line", { x1: "15", y1: "10", x2: "15", y2: "10.01" }), h("line", { x1: "9", y1: "14", x2: "9", y2: "14.01" }), h("line", { x1: "15", y1: "14", x2: "15", y2: "14.01" }), h("path", { d: "M10 22v-4h4v4" }));
    if (name === "layers") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("polygon", { points: "12 2 2 7 12 12 22 7 12 2" }), h("polyline", { points: "2 17 12 22 22 17" }), h("polyline", { points: "2 12 12 17 22 12" }));
    if (name === "chart") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("path", { d: d.chart }), h("rect", { x: "3", y: "3", width: "18", height: "18", rx: "2" }));
    if (name === "refresh") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("polyline", { points: "23 4 23 10 17 10" }), h("path", { d: d.refresh }));
    if (name === "car") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "1.8" }, h("path", { d: d.car }), h("rect", { x: "2", y: "11", width: "20", height: "6", rx: "1" }), h("circle", { cx: "7", cy: "17", r: "2" }), h("circle", { cx: "17", cy: "17", r: "2" }));
    if (name === "search") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "2", strokeLinecap: "round" }, h("circle", { cx: "11", cy: "11", r: "7" }), h("line", { x1: "21", y1: "21", x2: "16.5", y2: "16.5" }));
    if (name === "chevL") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "2.2", strokeLinecap: "round", strokeLinejoin: "round" }, h("polyline", { points: "15 18 9 12 15 6" }));
    if (name === "chevR") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "2.2", strokeLinecap: "round", strokeLinejoin: "round" }, h("polyline", { points: "9 18 15 12 9 6" }));
    if (name === "chevD") return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: "2.2", strokeLinecap: "round", strokeLinejoin: "round" }, h("polyline", { points: "6 9 12 15 18 9" }));
    return h("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: name === "plus" ? "2.2" : "1.8", strokeLinecap: "round", strokeLinejoin: "round" }, h("path", { d: d[name] || d.home }));
  }

  function NavButton({ icon, label, active, onClick }) {
    return h("button", { onClick, style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 3, background: active ? C.accentLight : "transparent", border: "none", borderRadius: 12, padding: "7px 12px", cursor: "pointer", minWidth: 56, transition: "background 0.15s" } },
      h(Icon, { name: icon, size: 20, color: active ? C.accent : C.muted }),
      h("span", { style: { fontSize: 10, fontWeight: active ? 700 : 500, color: active ? C.accent : C.muted, fontFamily: FONT } }, label)
    );
  }
  function Card({ children, style, onClick }) {
    return h("div", { onClick, style: { background: C.card, borderRadius: 16, padding: 20, border: `1px solid ${C.border}`, boxShadow: C.shadow, ...style } }, children);
  }
  function StatCard({ label, value, icon, color = C.accent, bg = C.accentLight }) {
    return h(Card, { style: { display: "flex", alignItems: "flex-start", gap: 14 } },
      h("div", { style: { width: 40, height: 40, borderRadius: 12, background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } }, h(Icon, { name: icon, size: 18, color })),
      h("div", { style: { flex: 1 } },
        h("div", { style: { fontSize: 12, color: C.sub, fontWeight: 500, marginBottom: 4 } }, label),
        h("div", { style: { fontSize: 20, fontWeight: 700, color: C.text, fontFamily: MONO } }, value)
      )
    );
  }
  function InputField({ label, type = "text", value, onChange, placeholder, inputMode }) {
    return h("div", null,
      h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, label),
      h("input", { type, value, onChange: (e) => onChange(e.target.value), placeholder, inputMode, style: { width: "100%", padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 14, fontFamily: FONT, background: C.bg, outline: "none", boxSizing: "border-box", color: C.text } })
    );
  }
  function SelectField({ label, value, options, onChange }) {
    return h("div", null,
      h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, label),
      h("select", { value, onChange: (e) => onChange(e.target.value), style: { width: "100%", padding: "10px 12px", border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 14, fontFamily: FONT, background: C.bg, outline: "none", boxSizing: "border-box", color: C.text, cursor: "pointer" } },
        options.map((o) => h("option", { key: o, value: o }, o))
      )
    );
  }
  function ProgressBar({ ratio, color, height = 8, track = C.bg }) {
    const w = Math.min(Math.max(ratio, 0), 1) * 100;
    return h("div", { style: { background: track, borderRadius: height / 2, height, overflow: "hidden" } },
      h("div", { style: { width: `${w}%`, height: "100%", background: color, borderRadius: height / 2, transition: "width 0.3s" } })
    );
  }
  function PageLoader() {
    return h("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 60, gap: 12 } },
      h("div", { style: { width: 32, height: 32, border: `3px solid ${C.border}`, borderTop: `3px solid ${C.accent}`, borderRadius: "50%", animation: "spin 0.8s linear infinite" } }),
      h("span", { style: { fontSize: 13, color: C.muted } }, "Loading..."),
      h("style", null, `@keyframes spin{to{transform:rotate(360deg)}}`)
    );
  }
  function ConfirmDialog({ open, title, message, confirmLabel = "Delete", cancelLabel = "Cancel", confirmColor = C.red, onConfirm, onCancel, busy = false }) {
    if (!open) return null;
    return h("div", { style: { position: "fixed", inset: 0, background: "rgba(0,0,0,0.32)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, zIndex: 300 } },
      h("div", { style: { width: "100%", maxWidth: 360, background: C.card, borderRadius: 18, border: `1px solid ${C.border}`, padding: 20, boxShadow: "0 12px 40px rgba(0,0,0,0.12)" } },
        h("div", { style: { fontSize: 17, fontWeight: 800, color: C.text, marginBottom: 8 } }, title),
        h("div", { style: { fontSize: 13, color: C.sub, lineHeight: 1.5, marginBottom: 18, whiteSpace: "pre-wrap" } }, message),
        h("div", { style: { display: "flex", gap: 10, justifyContent: "flex-end" } },
          h("button", { onClick: onCancel, disabled: busy, style: { background: C.bg, color: C.text, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px", fontWeight: 700, fontSize: 13, cursor: busy ? "default" : "pointer", fontFamily: FONT, opacity: busy ? 0.6 : 1 } }, cancelLabel),
          h("button", { onClick: onConfirm, disabled: busy, style: { background: confirmColor, color: "#fff", border: "none", borderRadius: 10, padding: "10px 14px", fontWeight: 700, fontSize: 13, cursor: busy ? "default" : "pointer", fontFamily: FONT, opacity: busy ? 0.7 : 1 } }, busy ? "Deleting..." : confirmLabel)
        )
      )
    );
  }

  // ————— Transactions —————
  function TransactionsPage({ data, dashData, onAdd, onRefresh, onDelete, loading }) {
    const today = (new Date()).toISOString().split("T")[0];
    const [showForm, setShowForm] = useState(false);
    const [date, setDate] = useState(today);
    const [notes, setNotes] = useState("");
    const [category, setCategory] = useState("Other");
    const [incomeAmt, setIncomeAmt] = useState("");
    const [incomeAcc, setIncomeAcc] = useState("Lifestyle");
    const [expenseAmt, setExpenseAmt] = useState("");
    const [expenseAcc, setExpenseAcc] = useState("Home");
    const [filter, setFilter] = useState("All");
    const [search, setSearch] = useState("");
    const [showSearch, setShowSearch] = useState(false);
    const [saving, setSaving] = useState(false);
    const [formError, setFormError] = useState("");
    const [deleteTarget, setDeleteTarget] = useState(null);
    const [deleting, setDeleting] = useState(false);

    if (!data) return h(PageLoader, null);
    const accts = dashData?.accounts;
    const filters = ["All"].concat(ACCT_OPTS);
    const transactionsList = Array.isArray(data.transactions) ? data.transactions : [];

    const q = search.trim().toLowerCase();
    const filtered = transactionsList.filter((t) =>
      (filter === "All" || t.account === filter) &&
      (!q || (t.notes || "").toLowerCase().includes(q) || (t.category || "").toLowerCase().includes(q))
    );

    // Group by month, with per-month spend/income totals
    const rows = [];
    let curMonth = null;
    filtered.forEach((t) => {
      const ym = (t.date || "").slice(0, 7);
      if (ym !== curMonth) {
        curMonth = ym;
        const monthTxs = filtered.filter((x) => (x.date || "").slice(0, 7) === ym);
        const spent = monthTxs.reduce((s, x) => s + Math.min(0, toNum(x.amount)), 0);
        const income = monthTxs.reduce((s, x) => s + Math.max(0, toNum(x.amount)), 0);
        rows.push({ type: "header", key: "hdr-" + ym, label: monthLabel(ym), spent, income });
      }
      rows.push({ type: "tx", key: t.id, t });
    });

    const hasIncome = incomeAmt !== "" && Number(incomeAmt) > 0;
    const hasExpense = expenseAmt !== "" && Number(expenseAmt) > 0;
    const isTransfer = hasIncome && hasExpense;
    const amountsMatch = !isTransfer || (Math.abs(Number(incomeAmt) - Number(expenseAmt)) < 0.001);
    const canSave = (hasIncome || hasExpense) && amountsMatch && notes.trim() !== "";

    const resetForm = () => {
      setDate(today); setNotes(""); setCategory("Other");
      setIncomeAmt(""); setIncomeAcc("Lifestyle");
      setExpenseAmt(""); setExpenseAcc("Home");
      setFormError(""); setShowForm(false);
    };

    const handleSubmit = async () => {
      if (!notes.trim()) { setFormError("Please enter a description."); return; }
      if (!hasIncome && !hasExpense) { setFormError("Enter at least one amount."); return; }
      if (!amountsMatch) { setFormError("Transfer amounts must be equal."); return; }
      if (!canSave) return;
      setSaving(true);
      const prefix = isTransfer ? "⇆ " : "";
      const notesVal = prefix + notes.trim();
      const cat = isTransfer ? "Transfer" : category;
      if (hasIncome) {
        const r = await onAdd({ date, amount: String(Math.abs(Number(incomeAmt))), account: incomeAcc, notes: notesVal, category: cat });
        if (r && r.ok === false) { setSaving(false); setFormError(r.message || "Could not save."); return; }
      }
      if (hasExpense) {
        const r = await onAdd({ date, amount: String(-Math.abs(Number(expenseAmt))), account: expenseAcc, notes: notesVal, category: cat });
        if (r && r.ok === false) { setSaving(false); setFormError(r.message || "Could not save."); return; }
      }
      setSaving(false);
      resetForm();
    };

    const handleDelete = async () => {
      if (!deleteTarget) return;
      setDeleting(true);
      const result = await onDelete(deleteTarget);
      setDeleting(false);
      if (result && result.ok === false) { alert(result.message || "Delete failed."); return; }
      setDeleteTarget(null);
    };

    const acctSelect = (value, onChange) => h("select", { value, onChange: (e) => onChange(e.target.value), style: { width: "100%", padding: "8px 10px", border: `1px solid ${C.border}`, borderRadius: 8, fontSize: 13, fontFamily: FONT, background: "#fff", color: C.text, outline: "none" } },
      ACCT_OPTS.map((o) => h("option", { key: o, value: o }, (ACCT_META[o]?.emoji || "") + " " + o))
    );

    return h("div", { style: { display: "flex", flexDirection: "column", gap: 14 } },
      // Header row
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("h2", { style: { margin: 0, fontSize: 22, fontWeight: 800, letterSpacing: -0.3 } }, "Transactions"),

        )

        h("div", { style: { color: "rgba(255,255,255,0.65)", fontSize: 11, fontWeight: 700, letterSpacing: 0.8 } }, "TOTAL CASH"),

            h("div", { key: a.label, style: { flex: "1 1 30%", minWidth: 90, background: "rgba(255,255,255,0.12)", borderRadius: 12, padding: "8px 10px" } },
              h("div", { style: { color: "rgba(255,255,255,0.6)", fontSize: 9, fontWeight: 700, letterSpacing: 0.5, marginBottom: 2 } }, (ACCT_META[a.label]?.emoji || "") + " " + a.label.toUpperCase()),
              h("div", { style: { color: "#fff", fontSize: 14, fontWeight: 700, fontFamily: MONO } }, fmt(a.val))
            )

        )
      ),
      // Search bar
      showSearch && h("input", { type: "text", value: search, autoFocus: true, onChange: (e) => setSearch(e.target.value), placeholder: "Search descriptions or categories…", style: { width: "100%", padding: "11px 14px", border: `1px solid ${C.border}`, borderRadius: 12, fontSize: 14, fontFamily: FONT, background: C.card, outline: "none", color: C.text, boxSizing: "border-box" } }),
      // New transaction form
      showForm && h(Card, { style: { border: `2px solid ${C.accent}`, padding: 16 } },
        h("div", { style: { fontSize: 14, fontWeight: 700, marginBottom: 14, color: C.text } }, "New Transaction"),
        h("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
          h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
            h(InputField, { label: "Date", type: "date", value: date, onChange: setDate }),
            h(SelectField, { label: "Category", value: category, options: CATEGORIES, onChange: setCategory })
          ),
          h(InputField, { label: "Description", value: notes, onChange: (v) => { setNotes(v); setFormError(""); }, placeholder: "e.g. salary, groceries, sofa" }),
          h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
            h("div", { style: { background: "#FFF5F5", border: `2px solid ${C.red}`, borderRadius: 12, padding: 12 } },
              h("div", { style: { fontSize: 11, fontWeight: 700, color: C.red, marginBottom: 8, letterSpacing: 0.5 } }, "− EXPENSE"),
              h("div", { style: { marginBottom: 8 } },
                h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, "Account"),
                acctSelect(expenseAcc, setExpenseAcc)
              ),
              h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, "Amount ($)"),
              h("input", { type: "number", inputMode: "decimal", min: "0", value: expenseAmt,
                onChange: (e) => { setExpenseAmt(e.target.value.replace(/[^0-9.]/g, "")); setFormError(""); },
                placeholder: "0",
                style: { width: "100%", padding: "8px 10px", border: `1px solid ${C.red}`, borderRadius: 8, fontSize: 18, fontFamily: MONO, fontWeight: 700, color: C.red, background: "#fff", outline: "none", boxSizing: "border-box" }
              })
            ),
            h("div", { style: { background: "#F0FFF4", border: `2px solid ${C.accent}`, borderRadius: 12, padding: 12 } },
              h("div", { style: { fontSize: 11, fontWeight: 700, color: C.accent, marginBottom: 8, letterSpacing: 0.5 } }, "+ INCOME"),
              h("div", { style: { marginBottom: 8 } },
                h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, "Account"),
                acctSelect(incomeAcc, setIncomeAcc)
              ),
              h("label", { style: { fontSize: 11, fontWeight: 600, color: C.sub, marginBottom: 4, display: "block" } }, "Amount ($)"),
              h("input", { type: "number", inputMode: "decimal", min: "0", value: incomeAmt,
                onChange: (e) => { setIncomeAmt(e.target.value.replace(/[^0-9.]/g, "")); setFormError(""); },
                placeholder: "0",
                style: { width: "100%", padding: "8px 10px", border: `1px solid ${C.accent}`, borderRadius: 8, fontSize: 18, fontFamily: MONO, fontWeight: 700, color: C.accent, background: "#fff", outline: "none", boxSizing: "border-box" }
              })
            )
          ),
          isTransfer && h("div", { style: { background: "#F0FFF4", border: `1px solid ${C.accent}`, borderRadius: 8, padding: "8px 12px", fontSize: 12, color: C.accent, fontWeight: 600, textAlign: "center" } },
            amountsMatch ? "↔ Transfer — amounts match ✓" : "⚠ Amounts must be equal to transfer"
          ),
          formError ? h("div", { style: { color: C.red, fontSize: 12, fontWeight: 600, textAlign: "center" } }, formError) : null,
          h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 } },
            h("button", { onClick: resetForm, style: { background: C.bg, color: C.sub, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 0", fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: FONT } }, "Cancel"),
            h("button", { onClick: handleSubmit, disabled: saving || !canSave, style: { background: canSave ? C.accent : C.muted, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontWeight: 700, fontSize: 14, cursor: canSave ? "pointer" : "default", fontFamily: FONT, opacity: saving ? 0.7 : 1 } }, saving ? "Saving..." : "Save")
          )
        )
      ),
      // Account filters
      h("div", { style: { display: "flex", gap: 6, overflowX: "auto", paddingBottom: 2 } },
        filters.map((a) => h("button", { key: a, onClick: () => setFilter(a), style: { background: filter === a ? C.accent : C.card, color: filter === a ? "#fff" : C.sub, border: filter === a ? "none" : `1px solid ${C.border}`, borderRadius: 20, padding: "7px 14px", fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap", fontFamily: FONT } }, a))
      ),
      // Grouped list
      h(Card, { style: { padding: 0, overflow: "hidden" } },
        filtered.length === 0
          ? h("div", { style: { padding: 40, textAlign: "center", color: C.muted, fontSize: 14 } }, "No transactions found")
          : rows.map((row, i) => {
              if (row.type === "header") {
                return h("div", { key: row.key, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 16px", background: C.bg, borderBottom: `1px solid ${C.border}`, borderTop: i > 0 ? `1px solid ${C.border}` : "none" } },
                  h("span", { style: { fontSize: 11, fontWeight: 800, color: C.sub, letterSpacing: 0.6, textTransform: "uppercase" } }, row.label),
                  h("span", { style: { fontSize: 11, fontFamily: MONO, fontWeight: 600 } },
                    h("span", { style: { color: C.accent } }, "+" + fmt(row.income)),
                    h("span", { style: { color: C.muted } }, "  ·  "),
                    h("span", { style: { color: C.red } }, fmt(row.spent))
                  )
                );
              }
              const t = row.t;
              const amt = toNum(t.amount);
              const meta = ACCT_META[t.account] || { emoji: "💰", color: C.sub, light: C.bg };
              return h("div", { key: row.key, style: { display: "flex", alignItems: "center", padding: "12px 16px", borderBottom: `1px solid ${C.border}`, gap: 10, background: C.card } },
                h("div", { style: { width: 36, height: 36, borderRadius: 10, background: meta.light, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 } },
                  h("span", { style: { fontSize: 15 } }, meta.emoji)
                ),
                h("div", { style: { flex: 1, minWidth: 0 } },
                  h("div", { style: { fontSize: 13, fontWeight: 600, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, t.notes),
                  h("div", { style: { fontSize: 11, color: C.muted, marginTop: 2 } }, t.account, t.category ? " · " + t.category : "", " · ", t.date)
                ),
                h("div", { style: { display: "flex", flexDirection: "column", alignItems: "flex-end", flexShrink: 0 } },
                  h("div", { style: { fontSize: 14, fontWeight: 700, fontFamily: MONO, color: amt < 0 ? C.red : C.accent } },
                    amt < 0 ? `-$${Math.abs(amt).toLocaleString()}` : `+$${amt.toLocaleString()}`
                  ),
                  t.balAfter !== undefined && h("div", { style: { fontSize: 10.5, color: C.muted, fontFamily: MONO, marginTop: 2 } },
                    (t.balAccount === t.account ? "" : t.balAccount + " ") + fmt(t.balAfter)
                  )
                ),
                h("button", { onClick: () => setDeleteTarget(t), title: "Delete", style: { background: "transparent", border: "none", width: 26, height: 26, borderRadius: 8, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, padding: 0, opacity: 0.7 } },
                  h("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: C.red, strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" },
                    h("polyline", { points: "3 6 5 6 21 6" }),
                    h("path", { d: "M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2" }),
                    h("path", { d: "M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" }),
                    h("line", { x1: "10", y1: "11", x2: "10", y2: "17" }),
                    h("line", { x1: "14", y1: "11", x2: "14", y2: "17" })
                  )
                )
              );
            })
      ),
      h(ConfirmDialog, { open: !!deleteTarget, title: "Delete transaction?",
        message: deleteTarget ? `Permanently delete:\n${deleteTarget.notes}\n${deleteTarget.account} • ${deleteTarget.date} • ${fmt(deleteTarget.amount)}` : "",
        confirmLabel: "Delete", onConfirm: handleDelete, onCancel: () => !deleting && setDeleteTarget(null), busy: deleting })
    );
  }

  // ————— Budget / Stats —————
  function StatsPage({ txData, budgets, onSaveBudgets, onRefresh, loading }) {
    const [month, setMonth] = useState(thisMonth());
    const [expanded, setExpanded] = useState(null);
    const [editBudgets, setEditBudgets] = useState(false);
    const [budgetDraft, setBudgetDraft] = useState({});
    const [savingBudgets, setSavingBudgets] = useState(false);
    if (!txData) return h(PageLoader, null);
    const txs = txData.transactions || [];
    const B = { ...DEFAULT_BUDGETS, ...(budgets || {}) };

    const monthTxs = txs.filter((t) => (t.date || "").slice(0, 7) === month);
    const income = monthTxs.reduce((s, t) => s + Math.max(0, toNum(t.amount)), 0);
    const spent = monthTxs.reduce((s, t) => s + Math.min(0, toNum(t.amount)), 0);

    // Per-envelope numbers for the month.
    // Spending envelopes: progress = spent vs budget. Saving envelopes: progress = deposited vs target.
    const perAcct = ACCT_OPTS.map((a) => {
      const list = monthTxs.filter((t) => t.account === a);
      const aSpent = Math.abs(list.reduce((s, t) => s + Math.min(0, toNum(t.amount)), 0));
      const aIncome = list.reduce((s, t) => s + Math.max(0, toNum(t.amount)), 0);
      const isSaving = SAVING_ACCTS.includes(a);
      const used = isSaving ? aIncome : aSpent;
      const budget = toNum(B[a]);
      return { account: a, spent: aSpent, income: aIncome, isSaving, used, budget, list, over: budget > 0 && !isSaving && aSpent > budget };
    });

    const spendBudgetTotal = perAcct.filter((a) => !a.isSaving).reduce((s, a) => s + a.budget, 0);
    const spendUsedTotal = perAcct.filter((a) => !a.isSaving).reduce((s, a) => s + a.spent, 0);

    // Category breakdown for one expanded account
    const catBreakdown = (list) => {
      const map = {};
      list.forEach((t) => {
        const amt = toNum(t.amount);
        if (amt >= 0) return;
        const c = t.category || "Uncategorized";
        map[c] = (map[c] || 0) + Math.abs(amt);
      });
      return Object.entries(map).map(([cat, val]) => ({ cat, val })).sort((x, y) => y.val - x.val);
    };

    // 6-month expense trend
    const trendMonths = [];
    for (let i = 5; i >= 0; i--) trendMonths.push(shiftMonth(month, -i));
    const trend = trendMonths.map((ym) => ({
      ym,
      spent: Math.abs(txs.filter((t) => (t.date || "").slice(0, 7) === ym).reduce((s, t) => s + Math.min(0, toNum(t.amount)), 0))
    }));
    const trendMax = Math.max(...trend.map((t) => t.spent), 1);

    const isCurrent = month === thisMonth();

    const startEditBudgets = () => {
      const draft = {};
      ACCT_OPTS.forEach((a) => { draft[a] = String(toNum(B[a])); });
      setBudgetDraft(draft);
      setEditBudgets(true);
    };
    const saveBudgets = async () => {
      setSavingBudgets(true);
      const clean = {};
      ACCT_OPTS.forEach((a) => { clean[a] = toNum(budgetDraft[a]); });
      await onSaveBudgets(clean);
      setSavingBudgets(false);
      setEditBudgets(false);
    };

    return h("div", { style: { display: "flex", flexDirection: "column", gap: 14 } },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
        h("h2", { style: { margin: 0, fontSize: 22, fontWeight: 800, letterSpacing: -0.3 } }, "Budget"),
        h("button", { onClick: onRefresh, disabled: loading, style: { background: C.card, border: `1px solid ${C.border}`, borderRadius: 10, width: 38, height: 38, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", opacity: loading ? 0.6 : 1 } }, h(Icon, { name: "refresh", size: 16, color: C.sub }))
      ),
      // Month selector
      h(Card, { style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 12px" } },
        h("button", { onClick: () => { setMonth(shiftMonth(month, -1)); setExpanded(null); }, style: { background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, width: 34, height: 34, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" } }, h(Icon, { name: "chevL", size: 16, color: C.sub })),
        h("div", { style: { fontSize: 15, fontWeight: 800, color: C.text } }, monthLabel(month)),
        h("button", { onClick: () => { setMonth(shiftMonth(month, 1)); setExpanded(null); }, disabled: isCurrent, style: { background: C.bg, border: `1px solid ${C.border}`, borderRadius: 10, width: 34, height: 34, cursor: isCurrent ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", opacity: isCurrent ? 0.35 : 1 } }, h(Icon, { name: "chevR", size: 16, color: C.sub }))
      ),
      // Month overview: spent vs total spending budget
      h(Card, { style: { padding: 18 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 } },
          h("div", null,
            h("span", { style: { fontSize: 24, fontWeight: 800, fontFamily: MONO, color: spendUsedTotal > spendBudgetTotal ? C.red : C.text } }, fmt(spendUsedTotal)),
            h("span", { style: { fontSize: 13, color: C.muted, fontFamily: MONO } }, " / " + fmt(spendBudgetTotal))
          ),
          h("div", { style: { fontSize: 12, fontWeight: 700, color: spendUsedTotal > spendBudgetTotal ? C.red : C.accent } },
            spendUsedTotal > spendBudgetTotal ? "OVER BUDGET" : fmt(spendBudgetTotal - spendUsedTotal) + " left"
          )
        ),
        h(ProgressBar, { ratio: spendBudgetTotal > 0 ? spendUsedTotal / spendBudgetTotal : 0, color: spendUsedTotal > spendBudgetTotal ? C.red : C.accent, height: 10 }),
        h("div", { style: { display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11, color: C.muted, fontFamily: MONO } },
          h("span", null, "Income: ", h("span", { style: { color: C.accent, fontWeight: 700 } }, "+" + fmt(income))),
          h("span", null, "Net: ", h("span", { style: { color: income + spent >= 0 ? C.accent : C.red, fontWeight: 700 } }, fmt(income + spent)))
        )
      ),
      // Envelope cards — tap to drill into categories + transactions
      h("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
        perAcct.filter((a) => a.budget > 0 || a.spent > 0 || a.income > 0).map((a) => {
          const meta = ACCT_META[a.account];
          const isOpen = expanded === a.account;
          const ratio = a.budget > 0 ? a.used / a.budget : 0;
          const barColor = a.isSaving ? meta.color : (a.over ? C.red : meta.color);
          const cats = isOpen ? catBreakdown(a.list) : [];
          const catMax = Math.max(...cats.map((c) => c.val), 1);
          return h(Card, { key: a.account, style: { padding: "14px 16px", cursor: "pointer" }, onClick: () => setExpanded(isOpen ? null : a.account) },
            h("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 8 } },
              h("span", { style: { fontSize: 17 } }, meta.emoji),
              h("div", { style: { flex: 1 } },
                h("div", { style: { fontSize: 13.5, fontWeight: 800 } }, a.account,
                  a.over ? h("span", { style: { color: C.red, fontSize: 10, fontWeight: 800, marginLeft: 6 } }, "OVER") : null
                )
              ),
              h("div", { style: { textAlign: "right" } },
                h("div", { style: { fontSize: 13, fontWeight: 800, fontFamily: MONO, color: a.isSaving ? meta.color : (a.over ? C.red : C.text) } },
                  (a.isSaving ? "+" : "") + fmt(a.used),
                  a.budget > 0 ? h("span", { style: { fontSize: 11, color: C.muted, fontWeight: 600 } }, " / " + fmt(a.budget)) : null
                ),
                h("div", { style: { fontSize: 10, color: C.muted } }, a.isSaving ? "saved this month" : (a.budget > 0 ? fmt(Math.max(a.budget - a.spent, 0)) + " left" : "spent"))
              ),
              h(Icon, { name: isOpen ? "chevD" : "chevR", size: 14, color: C.muted })
            ),
            h(ProgressBar, { ratio, color: barColor, height: 7 }),
            // Drill-down: categories + transactions for this account this month
            isOpen && h("div", { onClick: (e) => e.stopPropagation(), style: { marginTop: 14, cursor: "default" } },
              cats.length > 0 && h("div", { style: { marginBottom: 12 } },
                h("div", { style: { fontSize: 11, fontWeight: 800, color: C.sub, letterSpacing: 0.5, marginBottom: 8 } }, "WHERE IT WENT"),
                cats.map((c) => h("div", { key: c.cat, style: { marginBottom: 8 } },
                  h("div", { style: { display: "flex", justifyContent: "space-between", marginBottom: 3 } },
                    h("span", { style: { fontSize: 12, fontWeight: 600 } }, c.cat),
                    h("span", { style: { fontSize: 12, fontFamily: MONO, fontWeight: 700, color: C.red } }, fmt(-c.val),
                      h("span", { style: { color: C.muted, fontWeight: 500 } }, "  " + Math.round(c.val / Math.max(a.spent, 1) * 100) + "%")
                    )
                  ),
                  h(ProgressBar, { ratio: c.val / catMax, color: meta.color, height: 5 })
                ))
              ),
              a.list.length > 0
                ? h("div", null,
                    h("div", { style: { fontSize: 11, fontWeight: 800, color: C.sub, letterSpacing: 0.5, marginBottom: 4 } }, "TRANSACTIONS"),
                    a.list.map((t, i) => h("div", { key: t.id || i, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "7px 0", borderBottom: i < a.list.length - 1 ? `1px solid ${C.border}` : "none" } },
                      h("div", { style: { minWidth: 0, flex: 1 } },
                        h("div", { style: { fontSize: 12.5, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, t.notes),
                        h("div", { style: { fontSize: 10.5, color: C.muted } }, (t.category ? t.category + " · " : "") + t.date.slice(8) + " " + monthShort(month))
                      ),
                      h("span", { style: { fontSize: 12.5, fontWeight: 700, fontFamily: MONO, color: toNum(t.amount) < 0 ? C.red : C.accent, flexShrink: 0, marginLeft: 8 } }, fmt(t.amount))
                    ))
                  )
                : h("div", { style: { fontSize: 12, color: C.muted, textAlign: "center", padding: 8 } }, "No transactions this month")
            )
          );
        })
      ),
      // 6-month trend
      h(Card, null,
        h("div", { style: { fontSize: 14, fontWeight: 700, marginBottom: 14 } }, "Spending Trend"),
        h("div", { style: { display: "flex", alignItems: "flex-end", gap: 8, height: 110 } },
          trend.map((t) => {
            const active = t.ym === month;
            const barH = Math.max(t.spent / trendMax * 78, t.spent > 0 ? 4 : 2);
            return h("div", { key: t.ym, onClick: () => { setMonth(t.ym); setExpanded(null); }, style: { flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", gap: 4, cursor: "pointer", height: "100%" } },
              h("div", { style: { fontSize: 9, fontFamily: MONO, fontWeight: 600, color: active ? C.red : C.muted } }, t.spent > 0 ? fmt(t.spent).replace("$", "") : ""),
              h("div", { style: { width: "100%", maxWidth: 34, height: barH, background: active ? C.red : "#EBD4D4", borderRadius: 6 } }),
              h("div", { style: { fontSize: 10, fontWeight: active ? 800 : 500, color: active ? C.text : C.muted } }, monthShort(t.ym))
            );
          })
        )
      ),
      // Budgets editor
      h(Card, null,
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h("div", { style: { fontSize: 14, fontWeight: 700 } }, "Monthly Budgets"),
          !editBudgets && h("button", { onClick: startEditBudgets, style: { background: C.accentLight, color: C.accent, border: "none", borderRadius: 8, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT } }, "Edit")
        ),

  // ————— App —————
  function App() {
    const [isUnlocked, setIsUnlocked] = useState(() => {
      try { return localStorage.getItem("personal_finance_unlocked") === "true"; } catch(e) { return false; }
    });
    const [page, setPage] = useState("transactions");
    const [loading, setLoading] = useState(false);
    const [migrating, setMigrating] = useState(false);
    const [isEmpty, setIsEmpty] = useState(false);
    const [migrateStatus, setMigrateStatus] = useState(null);
    const [dashboard, setDashboard] = useState(null);
    const [transactions, setTransactions] = useState(null);
    const [assets, setAssets] = useState(null);
    const [wedding, setWedding] = useState(null);
    const [investments, setInvestments] = useState(null);
    const [budgets, setBudgets] = useState(null);

    // Compute all derived state from raw Firebase data and set all at once
    const applyData = useCallback((txRaw, goldPrice, goldEntriesRaw, propertiesRaw, weddingBudget, inv, budgetsRaw) => {
      const gPrice = toNum(goldPrice);
      const list = txRaw ? sortTx(Object.entries(txRaw).map(([id, t]) => ({ ...t, id, amount: Number(t.amount) }))) : [];

      // Per-account running balances: walk chronologically (oldest → newest).
      // Wedding is a sub-account of Home — its transactions also move Home's
      // balance, and Wedding rows display Home's balance after the transaction.
      const bals = { Home: 0, Portfolio: 0, Lifestyle: 0, Savings: 0, Wedding: 0 };
      for (let i = list.length - 1; i >= 0; i--) {
        const t = list[i];
        if (t.account === "Wedding") {
          bals.Wedding += t.amount;
          bals.Home += t.amount;
          t.balAfter = bals.Home;
          t.balAccount = "Home";
        } else if (Object.prototype.hasOwnProperty.call(bals, t.account)) {
          bals[t.account] += t.amount;
          t.balAfter = bals[t.account];
          t.balAccount = t.account;
        }
      }

      const totalCash = bals.Home + bals.Portfolio + bals.Lifestyle + bals.Personal + bals.Savings;

      // Gold
      const goldEntries = goldEntriesRaw ? Object.entries(goldEntriesRaw).map(([id, e]) => {
        const troyOz = e.unit === "oz" ? toNum(e.weight) : toNum(e.weight) / 31.1035;
        return { ...e, id, troyOz, value: troyOz * gPrice };
      }) : [];
      const totalGoldOz = goldEntries.reduce((s, e) => s + e.troyOz, 0);
      const totalGoldValue = totalGoldOz * gPrice;

      // Properties
      const properties = propertiesRaw ? Object.entries(propertiesRaw).map(([id, p]) => ({ ...p, id })) : [];
      const propTotal = properties.reduce((s, p) => s + toNum(p.value), 0);

      // Investments
      const ibkr = toNum(inv?.balance);

      // Wedding
      const weddingSpent = Math.abs(bals.Wedding);
      const budget = toNum(weddingBudget);

      setTransactions({ transactions: list, balance: totalCash });
      setDashboard({
        accounts: { home: bals.Home, portfolio: bals.Portfolio, lifestyle: bals.Lifestyle, personal: bals.Personal, savings: bals.Savings },
        netWorth: { totalCash, goldReserve: totalGoldValue, property: propTotal, ibkr, total: totalCash + totalGoldValue + propTotal + ibkr }
      });
      setAssets({ goldPrice: gPrice, totalGoldOz, totalGoldValue, goldEntries, properties });
      setWedding({ totalBudget: budget, totalSpent: -weddingSpent, remaining: budget - weddingSpent, percentUsed: budget > 0 ? weddingSpent / budget : 0 });
      setBudgets(budgetsRaw || null);
      if (inv?.projections) {
        // Firebase stores arrays as objects with numeric keys — convert back
        const allocations = inv.allocations ? (Array.isArray(inv.allocations) ? inv.allocations : Object.values(inv.allocations)) : [];
        const projections = inv.projections ? (Array.isArray(inv.projections) ? inv.projections : Object.values(inv.projections)) : [];
        setInvestments({ ...inv, allocations, projections });
      }
    }, []);

    const load = useCallback(async () => {
      setLoading(true);
      try {
        const [txRaw, goldPrice, goldEntriesRaw, propertiesRaw, weddingBudget, inv, budgetsRaw] = await Promise.all([
          fb.get("transactions"), fb.get("goldPrice"), fb.get("goldEntries"),
          fb.get("properties"), fb.get("weddingBudget"), fb.get("investments"), fb.get("budgets")
        ]);
        if (!txRaw && goldPrice === null && !goldEntriesRaw) { setIsEmpty(true); return; }
        applyData(txRaw, goldPrice, goldEntriesRaw, propertiesRaw, weddingBudget, inv, budgetsRaw);
      } finally {
        setLoading(false);
      }
    }, [applyData]);

    useEffect(() => { load(); }, [load]);

    // One-time migration from Sheets → Firebase
    const migrateFromSheets = async () => {
      setMigrating(true);
      const log = [];
      const addLog = (line) => { log.push(line); setMigrateStatus([...log]); };
      try {
        addLog("⋯ Testing Firebase auth…");
        let token;
        try {
          token = await getAuthToken();
          addLog("✓ Firebase auth OK");
        } catch(e) {
          addLog("✗ Firebase auth FAILED: " + e.message);
          return;
        }

        addLog("⋯ Fetching data from Google Sheets…");
        let data;
        try {
          const r = await fetch(`${SHEETS_URL}?action=getAllData`);
          data = await r.json();
          if (data.error) { addLog("✗ Sheets error: " + data.error); return; }
          addLog(`✓ Sheets OK — ${(data.transactions||[]).length} transactions`);
        } catch(e) {
          addLog("✗ Sheets fetch FAILED: " + e.message);
          return;
        }

        addLog("⋯ Testing Firebase write…");
        const testWrite = await fetch(`${FB}/goldPrice.json?auth=${token}`, { method: "PUT", body: JSON.stringify(data.goldPrice || 0) });
        if (!testWrite.ok) {
          const err = await testWrite.text();
          addLog("✗ Firebase write FAILED (" + testWrite.status + "): " + err);
          return;
        }
        addLog("✓ Firebase write OK");

        addLog("⋯ Writing all data to Firebase…");
        const writes = [];
        (data.transactions || []).forEach((t) => writes.push(
          fb.post("transactions", { date: t.date, amount: Number(t.amount), account: t.account, notes: t.notes })
        ));
        writes.push(fb.put("weddingBudget", data.weddingBudget || 0));
        (data.goldEntries || []).forEach(e => writes.push(fb.post("goldEntries", { date: e.date, description: e.description, weight: e.weight, unit: e.unit })));
        (data.properties || []).forEach(p => writes.push(fb.post("properties", { name: p.name, type: p.type, value: p.value })));
        if (data.investments) writes.push(fb.put("investments", data.investments));
        await Promise.all(writes);
        addLog("✓ All data written");

        setIsEmpty(false);
        await load();
      } catch(e) {
        addLog("✗ Unexpected error: " + e.message);
      } finally {
        setMigrating(false);
      }
    };

    const addTransaction = async (form) => {
      const txData = { date: form.date, amount: Number(form.amount), account: form.account, notes: form.notes, category: form.category || "Other" };
      // Optimistic — show instantly, sorted into correct position
      const optimisticId = "_opt_" + Date.now();
      setTransactions(prev => prev ? { ...prev, transactions: sortTx([{ ...txData, id: optimisticId }, ...prev.transactions]), balance: prev.balance + txData.amount } : prev);
      // Write to Firebase (fast)
      const result = await fb.post("transactions", txData);
      if (!result?.name) { await load(); return { ok: false, message: "Firebase write failed." }; }
      setTransactions(prev => prev ? { ...prev, transactions: sortTx(prev.transactions.map(t => t.id === optimisticId ? { ...t, id: result.name } : t)) } : prev);
      // Sync to Sheets in background (non-blocking)
      sheetsSync({ action: "addTransaction", ...form, firebaseId: result.name });
      // Silent background reload recomputes account cards + running balances
      load();
      return { ok: true };
    };

    const deleteTransaction = async (transaction) => {
      // Optimistic remove
      setTransactions(prev => prev ? { ...prev, transactions: prev.transactions.filter(t => t.id !== transaction.id), balance: prev.balance - transaction.amount } : prev);
      // Delete from Firebase
      const ok = await fb.remove(`transactions/${transaction.id}`);
      if (!ok) { await load(); return { ok: false, message: "Firebase delete failed." }; }
      // Sync to Sheets in background
      sheetsSync({ action: "deleteTransaction", transaction });
      // Silent background reload recomputes account cards + running balances
      load();
      return { ok: true };
    };

    const updateGoldPrice = async (price) => {
      await fb.put("goldPrice", Number(price));
      sheetsSync({ action: "updateGoldPrice", price });
      await load();
    };

    const saveBudgets = async (b) => {
      await fb.put("budgets", b);
      setBudgets(b);
    };

    if (!isUnlocked) return h(LockScreen, { onUnlock: () => setIsUnlocked(true) });
    if (isEmpty) return h(MigrationScreen, { onMigrate: migrateFromSheets, migrating, migrateStatus });

    return h("div", { style: { fontFamily: FONT, background: C.bg, minHeight: "100vh", color: C.text, maxWidth: 480, margin: "0 auto", position: "relative" } },
      h("div", { style: { padding: "16px 20px 12px", display: "flex", alignItems: "center", justifyContent: "space-between" } },
        h("span", { style: { fontSize: 16, fontWeight: 800, letterSpacing: -0.3 } }, "Personal Finance"),
        h("div", { style: { fontSize: 11, color: C.muted, fontFamily: MONO } }, (new Date()).toLocaleDateString("en-US", { month: "short", day: "numeric" }))
      ),
      h("div", { style: { padding: "0 16px 100px" } },
        page === "transactions" && h(TransactionsPage, { data: transactions, dashData: dashboard, onAdd: addTransaction, onRefresh: load, onDelete: deleteTransaction, loading }),
        page === "stats" && h(StatsPage, { txData: transactions, budgets, onSaveBudgets: saveBudgets, onRefresh: load, loading }),
        page === "assets" && h(AssetsPage, { data: assets, dashData: dashboard, onUpdateGold: updateGoldPrice, onRefresh: load, loading }),
        page === "wedding" && h(WeddingPage, { data: wedding, txData: transactions, onRefresh: load, loading }),
        page === "investments" && h(InvestmentsPage, { data: investments, onRefresh: load, loading })
      ),
      h("div", { style: { position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 480, background: "rgba(255,255,255,0.95)", backdropFilter: "blur(12px)", borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "space-around", padding: "6px 8px env(safe-area-inset-bottom, 10px)", zIndex: 100 } },
        h(NavButton, { icon: "wallet", label: "Txns", active: page === "transactions", onClick: () => setPage("transactions") }),
        h(NavButton, { icon: "chart", label: "Budget", active: page === "stats", onClick: () => setPage("stats") }),
        h(NavButton, { icon: "layers", label: "Assets", active: page === "assets", onClick: () => setPage("assets") }),
        h(NavButton, { icon: "ring", label: "Wedding", active: page === "wedding", onClick: () => setPage("wedding") }),
        h(NavButton, { icon: "trending", label: "Invest", active: page === "investments", onClick: () => setPage("investments") })
      )
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(h(App, null));
})();
</script>
</body>
</html>
