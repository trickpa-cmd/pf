<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Finance"/>
<meta name="theme-color" content="#F6F6F3" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0F1012" media="(prefers-color-scheme: dark)"/>
<title>Personal Finance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231F5135'/><path d='M30 62l16-16 10 10 16-18' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --surface-2:#F1F0EC; --line:#E7E5E0; --line-strong:#D8D6D0;
  --text:#17181A; --text-2:#5F6168; --text-3:#9A9CA3;
  --brand:#1F5135; --brand-2:#2A6B47; --brand-soft:#E5EFE8; --on-brand:#FFFFFF;
  --pos:#157F4A; --neg:#C8372D; --neg-soft:#FBEAE8; --warn:#B76E00; --warn-soft:#FBF1E0;
  --a-home:#3B7A57; --a-lifestyle:#D08A1E; --a-savings:#A88420; --a-portfolio:#3D6FD8; --a-wedding:#8E5BD8;
  --c-cash:#2A6B47; --c-gold:#C9A227; --c-property:#5B7FB8; --c-ibkr:#7A5BC4;
  --shadow-sm:0 1px 2px rgba(20,20,20,.04),0 1px 1px rgba(20,20,20,.03);
  --shadow-lg:0 20px 50px rgba(20,20,20,.18);
  --overlay:rgba(15,16,18,.38);
  --radius:18px; --radius-sm:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1012; --surface:#17181B; --surface-2:#202125; --line:#26282C; --line-strong:#33353B;
    --text:#F2F2F3; --text-2:#A6A8AF; --text-3:#6E7078;
    --brand:#5CC08A; --brand-2:#4BAF79; --brand-soft:#17291F; --on-brand:#0B1A11;
    --pos:#4CC27F; --neg:#FF6B5E; --neg-soft:#2C1715; --warn:#E9A23B; --warn-soft:#2A2114;
    --a-home:#5CC08A; --a-lifestyle:#E9A23B; --a-savings:#D4B44A; --a-portfolio:#6E9BFF; --a-wedding:#B48CFF;
    --c-cash:#5CC08A; --c-gold:#D4B44A; --c-property:#7EA2DB; --c-ibkr:#A88BFF;
    --shadow-sm:none; --shadow-lg:0 20px 50px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.55);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Layout */
.layout{min-height:100dvh}
.sidebar{display:none}
.main{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:248px 1fr}
  .sidebar{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;padding:28px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .main{max-width:760px;width:100%;padding:36px 40px 64px}
  .tabbar{display:none!important}
}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:0 10px 22px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text-2);font-weight:500;font-size:14px;text-align:left}
.side-link:hover{background:var(--surface-2);color:var(--text)}
.side-link[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side-add{margin-top:14px;justify-content:center;background:var(--brand);color:var(--on-brand)!important;font-weight:600}
.side-add:hover{background:var(--brand-2)}
.side-foot{margin-top:auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line)}
.tabbar-inner{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--text-3);font-size:11px;font-weight:500;min-height:48px;justify-content:center}
.tab[aria-current=page]{color:var(--brand);font-weight:600}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 35%,transparent);transform:translateY(-10px);transition:transform .15s}
.fab:active{transform:translateY(-8px) scale(.96)}

/* Page header */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.025em}
.page-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);background:var(--surface);border:1px solid var(--line)}
.icon-btn:hover{color:var(--text)}

/* Surfaces */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.pad{padding:18px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.section-title h3{font-size:15px;font-weight:600;letter-spacing:-.01em}
.link{color:var(--brand);font-size:13px;font-weight:600}
.label{font-size:12px;font-weight:500;color:var(--text-2)}
.eyebrow{font-size:12px;font-weight:500;color:var(--text-2);letter-spacing:.01em}

/* Hero */
.hero{padding:22px 20px 20px}
.hero-amount{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:6px}
.hero-amount .cents{font-size:.55em;color:var(--text-3);font-weight:600;letter-spacing:-.01em}
.delta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:500;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.pos{background:var(--brand-soft)} .pill.neg{background:var(--neg-soft)} .pill.warn{background:var(--warn-soft);color:var(--warn)}

.acct-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.acct{min-width:0;padding:10px 8px;border-radius:14px;text-align:left}
.acct-name{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-name .dot{width:6px;height:6px}
.acct-bal{font-size:14px;font-weight:600;margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (min-width:600px){.acct-row{gap:8px}.acct{padding:14px 16px}.acct-name{font-size:13px;gap:7px}.acct-name .dot{width:8px;height:8px}.acct-bal{font-size:18px;margin-top:6px}}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Progress */
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.stackbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stackbar>span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px}
.legend-item .v{margin-left:auto;font-weight:600}

/* Stats grid */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line);margin:16px -18px -18px;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .v{font-size:15px;font-weight:600;margin-top:2px}

/* Lists */
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:62px}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:var(--surface-2)}
.tile{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex-shrink:0;position:relative}
.tile .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border:2px solid var(--surface)}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{text-align:right;flex-shrink:0}
.row-amt{font-size:15px;font-weight:600}
.row-meta{font-size:12px;color:var(--text-3);margin-top:1px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 8px;font-size:13px}
.group-head b{font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--text-2);font-size:14px}
.empty .big{font-size:28px;margin-bottom:6px}

/* Inputs */
.search{position:relative;display:block;margin-bottom:12px}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 42px;font-size:16px;outline:none}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;left:14px;top:13px;color:var(--text-3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:900px){.chips{margin:0;padding:0 0 2px;flex-wrap:wrap}}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500;color:var(--text-2);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg)}
.chip-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (min-width:700px){.chip-grid{grid-template-columns:repeat(6,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;font-weight:500;color:var(--text-2);min-width:0}
.cat .e{font-size:19px}
.cat[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;outline:none;width:100%}
.input:focus{border-color:var(--brand)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);padding:4px;border-radius:14px;gap:4px}
.seg button{height:38px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-input{display:flex;align-items:center;justify-content:center;gap:2px;padding:14px 0 6px}
.amount-input span{font-size:34px;font-weight:600;color:var(--text-3)}
.amount-input input{font-size:48px;font-weight:700;letter-spacing:-.03em;border:none;outline:none;background:transparent;text-align:center;width:100%;max-width:300px;font-variant-numeric:tabular-nums}
.amount-input input::placeholder{color:var(--text-3)}
.amount-input.neg input{color:var(--text)} .amount-input.pos input{color:var(--pos)}

.btn{height:50px;border-radius:14px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:disabled{opacity:.45;cursor:default}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--neg-soft);color:var(--neg)}
.btn-sm{height:34px;font-size:13px;border-radius:10px;width:auto;padding:0 12px}
.sheet-cta{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:0 -20px calc(-20px - env(safe-area-inset-bottom));padding:12px 20px calc(20px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
@media (min-width:700px){.sheet-cta{bottom:-24px;margin:0 -24px -24px;padding:14px 24px 24px}}
.err{color:var(--neg);font-size:13px;font-weight:500;text-align:center}

/* Sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.overlay{align-items:center;padding:24px}.sheet{border-radius:24px;padding:8px 24px 24px;animation:pop .2s ease}}
.grab{width:36px;height:5px;border-radius:9px;background:var(--line-strong);margin:4px auto 10px}
@media (min-width:700px){.grab{display:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.sheet-head h2{font-size:18px;font-weight:700;letter-spacing:-.015em}
.close{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.kv{display:flex;justify-content:space-between;padding:12px 0;font-size:14px}
.kv+.kv{border-top:1px solid var(--line)}
.kv span:first-child{color:var(--text-2)}
.kv span:last-child{font-weight:500;text-align:right}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;background:var(--text);color:var(--bg);padding:12px 14px 12px 18px;border-radius:14px;display:flex;align-items:center;gap:16px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .22s ease;max-width:calc(100% - 32px);white-space:nowrap}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.toast button{color:var(--brand);font-weight:700;filter:brightness(1.4)}
@media (min-width:900px){.toast{bottom:32px}}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .b{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--surface-2);transition:height .4s}
.chart .col[aria-pressed=true] .b{background:var(--brand)}
.chart .lbl{font-size:12px;color:var(--text-3);font-weight:500}
.chart .col[aria-pressed=true] .lbl{color:var(--text);font-weight:600}
.chart .val{font-size:11px;color:var(--text-3);font-weight:500;min-height:14px}

.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.monthnav button{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.monthnav button:disabled{opacity:.3;cursor:default}
.monthnav b{font-weight:600;font-size:15px}

.env{padding:16px 18px;width:100%;text-align:left;display:block}
.env-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.env-name{font-weight:600;font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.env-fig{text-align:right}
.env-fig .a{font-weight:600}
.env-fig .b{font-size:12px;color:var(--text-2)}
.drill{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mini-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}

.banner{background:var(--neg-soft);color:var(--neg);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.demo-badge{position:fixed;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;letter-spacing:.04em}

.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:380px}
.auth-card .logo{width:52px;height:52px;border-radius:16px;margin:0 auto 18px}
.auth h1{font-size:24px;font-weight:700;letter-spacing:-.02em;text-align:center}
.auth p{text-align:center;color:var(--text-2);font-size:14px;margin:4px 0 24px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
(() => {
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const h = React.createElement;
  const DEMO = new URLSearchParams(location.search).has("demo");

  // ————— Utils —————
  const toNum = (v) => {
    if (typeof v === "number") return Number.isFinite(v) ? v : 0;
    if (typeof v === "string") { const n = Number(v.replace(/[$,\s]/g, "")); return Number.isFinite(n) ? n : 0; }
    const n = Number(v); return Number.isFinite(n) ? n : 0;
  };
  const money = (n, opts = {}) => {
    const v = toNum(n), a = Math.abs(v);
    const frac = Math.round(a * 100) % 100 !== 0;
    const s = a.toLocaleString("en-US", { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: frac ? 2 : 0 });
    const pre = v < 0 ? "−" : (opts.sign && v > 0 ? "+" : "");
    return `${pre}$${s}`;
  };
  const compact = (n) => {
    const a = Math.abs(toNum(n));
    if (a >= 1e6) return "$" + (a / 1e6).toFixed(1) + "M";
    if (a >= 1e4) return "$" + Math.round(a / 1e3) + "k";
    if (a >= 1e3) return "$" + (a / 1e3).toFixed(1) + "k";
    return "$" + Math.round(a);
  };
  const pct = (n) => `${(n * 100).toFixed(1)}%`;
  const pad2 = (n) => String(n).padStart(2, "0");
  const localDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const thisMonth = () => localDate().slice(0, 7);
  const parseD = (s) => { const [y, m, d] = (s || "").split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const monthLabel = (ym) => parseD(ym + "-01").toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const monthShort = (ym) => parseD(ym + "-01").toLocaleDateString("en-US", { month: "short" });
  const shiftMonth = (ym, delta) => { const d = parseD(ym + "-01"); d.setMonth(d.getMonth() + delta); return localDate(d).slice(0, 7); };
  const dayLabel = (s) => {
    const today = localDate(), y = new Date(); y.setDate(y.getDate() - 1);

        h("div", { className: "muted", style: { fontSize: 13 } }, DEMO ? "Demo mode — changes stay in this tab." : lastSync ? `Last synced ${lastSync.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}` : ""),
        h("button", { className: "btn btn-ghost", onClick: () => { onRefresh(); onClose(); } }, h(Icon, { n: "refresh", s: 18 }), "Refresh data"),
        h("div", { className: "label", style: { marginTop: 10 } }, "Archive"),
        h(Card, { className: "list" },
          h("button", { className: "row", onClick: openWedding },
            h("div", { className: "tile", style: { color: "var(--a-wedding)" } }, h(Icon, { n: "ring", s: 20 })),
            h("div", { className: "row-main" }, h("div", { className: "row-title" }, "Wedding fund"), h("div", { className: "row-sub" }, "Budget and payments")),
            h("span", { className: "faint" }, h(Icon, { n: "chevR", s: 18 })))),
        !DEMO && h("button", { className: "btn btn-danger", onClick: onSignOut }, h(Icon, { n: "logout", s: 18 }), "Sign out")));
  }

  // ————— Auth —————
  function SignIn({ onDone }) {
    const [email, setEmail] = useState("");
    const [pw, setPw] = useState("");
    const [err, setErr] = useState("");
    const [busy, setBusy] = useState(false);
    const submit = async (e) => {
      e.preventDefault();
      if (!email.trim() || !pw) { setErr("Enter your email and password"); return; }
      setBusy(true); setErr("");
      try { await signIn(email.trim(), pw); onDone(); } catch (ex) { setErr(ex.message); setBusy(false); }
    };
    return h("div", { className: "auth" },
      h("form", { className: "auth-card stack", onSubmit: submit, style: { gap: 12 } },
        h("div", { className: "logo" }, h(Icon, { n: "up", s: 26, w: 2.2 })),
        h("h1", null, "Personal Finance"),
        h("p", null, "Sign in to continue"),
        h("input", { className: "input", type: "email", inputMode: "email", autoComplete: "username", placeholder: "Email", autoFocus: true, value: email, onChange: (e) => { setEmail(e.target.value); setErr(""); } }),
        h("input", { className: "input", type: "password", autoComplete: "current-password", placeholder: "Password", value: pw, onChange: (e) => { setPw(e.target.value); setErr(""); } }),
        err && h("div", { className: "err" }, err),
        h("button", { className: "btn btn-primary", type: "submit", disabled: busy }, busy ? "Signing in…" : "Sign in")));
  }

  // One-time migration from Sheets → Firebase, shown only when Firebase is empty.
  function ImportScreen({ onDone }) {
    const [busy, setBusy] = useState(false);
    const [log, setLog] = useState([]);
    const run = async () => {
      setBusy(true);
      const lines = [];
      const add = (l) => { lines.push(l); setLog([...lines]); };
      try {
        add("⋯ Fetching data from Google Sheets…");
        const data = await (await fetch(`${SHEETS_URL}?action=getAllData`)).json();
        if (data.error) { add("✗ Sheets error: " + data.error); return; }
        add(`✓ Found ${(data.transactions || []).length} transactions`);
        add("⋯ Writing to Firebase…");
        const writes = [fbReq("goldPrice", "PUT", data.goldPrice || 0), fbReq("weddingBudget", "PUT", data.weddingBudget || 0)];
        (data.transactions || []).forEach((t) => writes.push(fbReq("transactions", "POST", { date: t.date, amount: Number(t.amount), account: t.account, notes: t.notes })));
        (data.goldEntries || []).forEach((e) => writes.push(fbReq("goldEntries", "POST", { date: e.date, description: e.description, weight: e.weight, unit: e.unit })));
        (data.properties || []).forEach((p) => writes.push(fbReq("properties", "POST", { name: p.name, type: p.type, value: p.value })));
        if (data.investments) writes.push(fbReq("investments", "PUT", data.investments));
        await Promise.all(writes);
        add("✓ All data imported");
        onDone();
      } catch (e) {
        add("✗ " + e.message);
      } finally { setBusy(false); }
    };
    return h("div", { className: "auth" },
      h("div", { className: "auth-card stack", style: { gap: 12 } },
        h("div", { className: "logo" }, h(Icon, { n: "up", s: 26, w: 2.2 })),
        h("h1", null, "First-time setup"),
        h("p", null, "Your database is empty. Import your data from Google Sheets — this only needs to happen once."),
        h("button", { className: "btn btn-primary", disabled: busy, onClick: run }, busy ? "Importing…" : "Import from Google Sheets"),
        log.map((l, i) => h("div", { key: i, className: "num", style: { fontSize: 13, color: l.startsWith("✗") ? "var(--neg)" : l.startsWith("✓") ? "var(--pos)" : "var(--text-2)" } }, l))));
  }

  // ————— App —————
  const NAV = [
    { id: "home", label: "Home", icon: "home" },
    { id: "activity", label: "Activity", icon: "list" },
    { id: "budget", label: "Budget", icon: "pie" },
    { id: "wealth", label: "Wealth", icon: "layers" }
  ];

  function App() {
    const [authed, setAuthed] = useState(() => api.hasSession());
    const [raw, setRaw] = useState(null);
    const [status, setStatus] = useState("loading");
    const [error, setError] = useState("");
    const [page, setPage] = useState("home");
    const [filter, setFilter] = useState("All");
    const [sheet, setSheet] = useState(null); // { type, tx? }
    const [toast, setToast] = useState(null);
    const lastLoad = useRef(0);
    const toastTimer = useRef(null);

    useEffect(() => { _onAuthLost = () => setAuthed(false); }, []);

    const load = useCallback(async () => {
      if (!api.hasSession()) return;
      try {
        const r = await api.loadAll();
        lastLoad.current = Date.now();
        setError("");
        // Only offer the Sheets import when Firebase answered and is truly empty.
        if (!r.transactions && r.goldPrice === null && !r.goldEntries) { setStatus("empty"); return; }
        setRaw(r); setStatus("ready");
      } catch (e) {
        if (e.message !== AUTH_REQUIRED) { setError("Couldn't load your data. Check your connection."); setStatus((s) => s === "loading" ? "error" : s); }
      }
    }, []);
    useEffect(() => { if (authed) load(); }, [authed, load]);
    useEffect(() => {
      const onVis = () => { if (document.visibilityState === "visible" && authed && Date.now() - lastLoad.current > 60000) load(); };
      document.addEventListener("visibilitychange", onVis);
      return () => document.removeEventListener("visibilitychange", onVis);
    }, [authed, load]);

    const d = useMemo(() => raw ? derive(raw) : null, [raw]);
    const showToast = (msg, action) => {
      clearTimeout(toastTimer.current);
      setToast({ msg, action });
      toastTimer.current = setTimeout(() => setToast(null), 5000);
    };
    const patchTx = (fn) => setRaw((r) => { const tx = { ...(r.transactions || {}) }; fn(tx); return { ...r, transactions: tx }; });
    const go = (p, f) => { setPage(p); if (f) setFilter(f); window.scrollTo({ top: 0 }); };
    const close = useCallback(() => setSheet(null), []);

    const saveTx = async (form) => {
      const editing = sheet?.tx;
      if (editing) {
        const sign = form.mode === "income" ? 1 : -1;
        const prefix = (editing.notes || "").startsWith("⇆") ? "⇆ " : "";
        const t = { date: form.date, amount: sign * form.amount, account: form.account, notes: prefix + (form.notes || form.category), category: form.category };
        await api.putTx(editing.id, t);
        patchTx((tx) => { tx[editing.id] = t; });
        const { balAfter, balAccount, id, ...old } = editing;
        sheetsSync({ action: "deleteTransaction", transaction: { ...old, id } }).then(() => sheetsSync({ action: "addTransaction", ...t, amount: String(t.amount), firebaseId: editing.id }));
        setSheet(null); showToast("Changes saved");
        return;
      }
      const legs = form.mode === "transfer"
        ? [{ amount: -form.amount, account: form.account }, { amount: form.amount, account: form.toAccount }]
        : [{ amount: (form.mode === "income" ? 1 : -1) * form.amount, account: form.account }];
      const notes = form.mode === "transfer" ? "⇆ " + (form.notes || `${form.account} → ${form.toAccount}`) : (form.notes || form.category);
      for (const leg of legs) {
        const t = { date: form.date, amount: leg.amount, account: leg.account, notes, category: form.category };
        const id = await api.addTx(t);
        patchTx((tx) => { tx[id] = t; });
        sheetsSync({ action: "addTransaction", ...t, amount: String(t.amount), firebaseId: id });
      }
      setSheet(null);
      showToast(form.mode === "transfer" ? "Transfer saved" : `${form.mode === "income" ? "Income" : "Expense"} added`);
    };

    const deleteTx = async (t) => {
      const { balAfter, balAccount, id, ...data } = t;
      try { await api.deleteTx(id); } catch (e) { showToast("Delete failed. Try again."); return; }
      patchTx((tx) => { delete tx[id]; });
      sheetsSync({ action: "deleteTransaction", transaction: t });
      setSheet(null);
      showToast("Transaction deleted", {
        label: "Undo", run: async () => {
          await api.putTx(id, data);
          patchTx((tx) => { tx[id] = data; });
          sheetsSync({ action: "addTransaction", ...data, amount: String(data.amount), firebaseId: id });
          showToast("Restored");
        }
      });
    };

    const saveBudgets = async (b) => { await api.putBudgets(b); setRaw((r) => ({ ...r, budgets: b })); setSheet(null); showToast("Budgets saved"); };
    const saveGold = async (p) => { await api.putGoldPrice(p); sheetsSync({ action: "updateGoldPrice", price: p }); setRaw((r) => ({ ...r, goldPrice: p })); setSheet(null); showToast("Gold price updated"); };

    if (!authed) return h(SignIn, { onDone: () => { setStatus("loading"); setAuthed(true); } });
    if (status === "empty") return h(ImportScreen, { onDone: () => { setStatus("loading"); load(); } });

    const openTx = (t) => setSheet({ type: "detail", tx: t });
    let content;
    if (status === "error" && !d) content = h(Card, { className: "empty", style: { marginTop: 40 } }, h("div", { className: "big" }, "📡"), error, h("div", { style: { marginTop: 14 } }, h("button", { className: "btn btn-ghost btn-sm", onClick: load }, "Try again")));
    else if (!d) content = h(Skeleton);
    else if (page === "home") content = h(HomePage, { d, go, openTx, openSettings: () => setSheet({ type: "settings" }) });
    else if (page === "activity") content = h(ActivityPage, { d, filter, setFilter, openTx });
    else if (page === "budget") content = h(BudgetPage, { d, editBudgets: () => setSheet({ type: "budgets" }) });
    else content = h(WealthPage, { d, editGold: () => setSheet({ type: "gold" }) });

    const add = () => setSheet({ type: "form" });
    return h("div", { className: "layout" },
      DEMO && h("div", { className: "demo-badge" }, "DEMO DATA"),
      h("nav", { className: "sidebar", "aria-label": "Main" },
        h("div", { className: "brandmark" }, h("div", { className: "logo" }, h(Icon, { n: "up", s: 17, w: 2.2 })), "Personal Finance"),
        NAV.map((n) => h("button", { key: n.id, className: "side-link", "aria-current": page === n.id ? "page" : undefined, onClick: () => go(n.id) }, h(Icon, { n: n.icon }), n.label)),
        h("button", { className: "side-link side-add", onClick: add }, h(Icon, { n: "plus", w: 2.2 }), "Add transaction"),
        h("div", { className: "side-foot" }, h("button", { className: "side-link", style: { width: "100%" }, onClick: () => setSheet({ type: "settings" }) }, h(Icon, { n: "user" }), "Account"))),
      h("main", { className: "main" },
        error && d && h("div", { className: "banner" }, error, h("button", { className: "link", onClick: load }, "Retry")),
        content),
      h("nav", { className: "tabbar", "aria-label": "Main" },
        h("div", { className: "tabbar-inner" },
          NAV.slice(0, 2).map((n) => h("button", { key: n.id, className: "tab", "aria-current": page === n.id ? "page" : undefined, onClick: () => go(n.id) }, h(Icon, { n: n.icon, s: 22 }), n.label)),
          h("button", { className: "fab", onClick: add, "aria-label": "Add transaction" }, h(Icon, { n: "plus", s: 26, w: 2.2 })),
          NAV.slice(2).map((n) => h("button", { key: n.id, className: "tab", "aria-current": page === n.id ? "page" : undefined, onClick: () => go(n.id) }, h(Icon, { n: n.icon, s: 22 }), n.label)))),
      sheet?.type === "form" && h(TxForm, { initial: sheet.tx, onSave: saveTx, onClose: close }),
      sheet?.type === "detail" && h(TxDetail, { t: sheet.tx, onClose: close, onDelete: deleteTx, onEdit: (t) => setSheet({ type: "form", tx: t }) }),
      sheet?.type === "budgets" && d && h(BudgetsForm, { budgets: d.budgets, onSave: saveBudgets, onClose: close }),
      sheet?.type === "gold" && d && h(GoldForm, { price: d.gold.price, onSave: saveGold, onClose: close }),
      sheet?.type === "wedding" && d && h(WeddingSheet, { d, onClose: close, openTx }),
      sheet?.type === "settings" && h(SettingsSheet, { onClose: close, onRefresh: load, openWedding: () => setSheet({ type: "wedding" }), lastSync: lastLoad.current ? new Date(lastLoad.current) : null, onSignOut: () => { signOut(); setSheet(null); setRaw(null); setAuthed(false); } }),
      toast && h("div", { className: "toast", role: "status" }, toast.msg,
        toast.action && h("button", { onClick: () => { setToast(null); toast.action.run(); } }, toast.action.label)));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
